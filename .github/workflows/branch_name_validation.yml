name: Validate branch name
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          echo "Validating PR source branch..."
          BRANCH_NAME="${{ github.head_ref }}"

          echo "Detected branch name: $BRANCH_NAME"

          # -------------------------------------------------------
          # Allowed patterns:
          #   1. feat|fix|chore|refactor|docs|test/<workItemID>-description
          #      - Work item = 1–7 digits
          #      - Description = lowercase letters, numbers, dot, underscore, hyphen
          #      Example: feat/332200-add_new_pipeline
          #
          #   2. release/x.y.z
          # -------------------------------------------------------

          REGEX='^((feat|fix|chore|refactor|docs|test)/#?[0-9]{1,7}-[a-z0-9._-]+|release/[0-9]+\.[0-9]+\.[0-9]+)$'


          if [[ ! "$BRANCH_NAME" =~ $REGEX ]]; then
            echo "::error::Invalid branch name."
            echo "Expected format:"
            echo "  feat/332200-add_new_pipeline"
            exit 1
          fi

          echo "Branch name is valid"
