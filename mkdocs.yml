site_name: eraXplor - Cost Export Tool
site_url: https://mohamed-eleraki.github.io/eraXplor
site_description: A Python CLI tool for exporting cost reports over Multi-providers AWS/Azure.
copyright: Copyright &copy; 2025 Mohamed eraki

repo_url: https://github.com/Mohamed-Eleraki/eraXplor
edit_uri: edit/main/docs/
repo_name: Mohamed-Eleraki/eraXplor

theme:
  name: "material"
  palette:
    - media: "(prefers-color-scheme)"
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      primary: green
      accent: light green
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: green
      accent: light green
      scheme: slate
      toggle:
        icon: material/brightness-5
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.sidebar
    - navigation.collapse
    - navigation.autoCollapsed
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - header.autohide
    - content.code.copy
    - content.tabs.link
    - toc.follow
  font:
    text: Roboto
    code: Roboto Mono
  custom_dir: overrides

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mohamed-Eleraki/eraXplor
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/eraXplor/
  version:
    provider: mike

# fetch date from docstring
plugins:
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
  - mermaid2
  - search
  - autorefs

markdown_extensions:
  - admonition
  - pymdownx.details

nav:
  # - Welcome to eraXplor - AWS cost Export Toold Docs: index.md
  - Welcome to eraXplor: index.md
  - Reference Overview: reference.md
  - Cloud Providers:
      - AWS:
          - Overview: aws/index.md
          - Tutorials: aws/tutorials.md
          - How-to Guides: aws/how-to-guides.md
          - Explanation: aws/explanation.md
          - Reference: aws/reference.md
          - API: api/aws.md
          - API Reference: api/aws-reference.md
      - Azure:
          - Overview: azure/index.md
          - Tutorials: azure/tutorials.md
          - How-to Guides: azure/how-to-guides.md
          - Explanation: azure/explanation.md
          - Reference: azure/reference.md
          - API: api/azure.md
          - API Reference: api/azure-reference.md
  - API Reference: api/reference.md
  - MCP: api/mcp.md
