{% extends "base.html" %}

{% block styles %}
{{ super() }}
<style>
  /* Subtle sidebar styling with arrows */
  
  /* Left sidebar */
  .md-sidebar--primary {
    border-right: 1px solid var(--md-default-fg-color--lightest);
  }
  
  /* Navigation section arrows */
  .md-sidebar--primary .md-nav__toggle::after {
    content: "▶";
    display: inline-block;
    font-size: 0.6em;
    margin-left: 0.5em;
    transition: transform 0.2s ease;
  }
  
  .md-sidebar--primary .md-nav__toggle[aria-expanded="true"]::after {
    transform: rotate(90deg);
  }
  
  /* Collapsible sections */
  .md-sidebar--primary .md-nav__item--section {
    margin: 0;
  }
  
  /* Subtle hover effect */
  .md-sidebar--primary .md-nav__item:hover {
    background-color: transparent;
  }
  
  .md-sidebar--primary .md-nav__item:hover > .md-nav__link {
    background-color: var(--md-default-fg-color--lightest);
  }
  
  /* Active link styling */
  .md-sidebar--primary .md-nav__link--active {
    color: var(--md-primary-fg-color);
  }
  
  /* Right sidebar (TOC) */
  .md-sidebar--secondary {
    border-left: 1px solid var(--md-default-fg-color--lightest);
  }
  
  /* TOC arrows */
  .md-sidebar--secondary .md-nav__toggle::after {
    content: "▶";
    display: inline-block;
    font-size: 0.6em;
    margin-left: 0.3em;
    transition: transform 0.2s ease;
  }
  
  .md-sidebar--secondary .md-nav__toggle[aria-expanded="true"]::after {
    transform: rotate(90deg);
  }
</style>
{% endblock %}
