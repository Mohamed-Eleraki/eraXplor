{% extends "base.html" %}

{% block styles %}
{{ super() }}
<style>
  /* Subtle sidebar styling with arrows */
  
  /* Left sidebar */
  .md-sidebar--primary {
    border-right: 1px solid var(--md-default-fg-color--lightest);
  }
  
  /* Navigation section arrows */
  .md-sidebar--primary .md-nav__toggle::after {
    content: "▶";
    display: inline-block;
    font-size: 0.6em;
    margin-left: 0.5em;
    transition: transform 0.2s ease;
  }
  
  .md-sidebar--primary .md-nav__toggle[aria-expanded="true"]::after {
    transform: rotate(90deg);
  }
  
  /* Collapsible sections */
  .md-sidebar--primary .md-nav__item--section {
    margin: 0;
  }
  
  /* DISABLE hover highlight effect on navigation items */
  .md-sidebar--primary .md-nav__item:hover {
    background-color: transparent !important;
  }
  
  .md-sidebar--primary .md-nav__item:hover > .md-nav__link {
    background-color: transparent !important;
  }
  
  /* Remove any hover backgrounds on nav links */
  .md-sidebar--primary .md-nav__link:hover {
    background-color: transparent !important;
  }
  
  /* Active link styling */
  .md-sidebar--primary .md-nav__link--active {
    color: var(--md-primary-fg-color);
  }
  
  /* Right sidebar (TOC) */
  .md-sidebar--secondary {
    border-left: 1px solid var(--md-default-fg-color--lightest);
  }
  
  /* TOC arrows */
  .md-sidebar--secondary .md-nav__toggle::after {
    content: "▶";
    display: inline-block;
    font-size: 0.6em;
    margin-left: 0.3em;
    transition: transform 0.2s ease;
  }
  
  .md-sidebar--secondary .md-nav__toggle[aria-expanded="true"]::after {
    transform: rotate(90deg);
  }
  
  /* Dark mode toggle label styling */
  .md-header__theme-label {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--md-default-fg-color);
    margin-left: 0.25rem;
    vertical-align: middle;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  /* Hide label on small screens */
  @media (max-width: 768px) {
    .md-header__theme-label {
      display: none;
    }
  }
</style>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
  /* JavaScript to collapse AWS and Azure sections on page load */
  document.addEventListener('DOMContentLoaded', function() {
    // Wait for Material theme to initialize
    setTimeout(function() {
      // Find all navigation sections in the primary sidebar
      var navSections = document.querySelectorAll('.md-sidebar--primary .md-nav__item--section');
      
      navSections.forEach(function(section) {
        var link = section.querySelector('.md-nav__link');
        var toggle = section.querySelector('.md-nav__toggle');
        
        // Check if this section is for AWS or Azure
        var sectionTitle = link ? link.textContent.trim() : '';
        if (sectionTitle === 'AWS' || sectionTitle === 'Azure') {
          // Force collapse the section
          if (toggle) {
            toggle.checked = false;
            toggle.setAttribute('aria-expanded', 'false');
          }
          
          // Hide the nested nav
          var nestedNav = section.querySelector('.md-nav');
          if (nestedNav) {
            nestedNav.hidden = true;
            nestedNav.setAttribute('aria-labelledby', link.id);
            link.setAttribute('aria-expanded', 'false');
          }
          
          // Add visual indicator that section is collapsed
          section.classList.add('md-nav__item--collapsed');
        }
      });
    }, 100);
  });
  
  /* JavaScript to add and update theme mode label */
  document.addEventListener('DOMContentLoaded', function() {
    // Wait for Material theme to be fully loaded
    setTimeout(function() {
      // Find the theme toggle button in the header
      var themeToggle = document.querySelector('.md-header__theme-select');
      
      if (themeToggle) {
        // Create the mode label span
        var labelSpan = document.createElement('span');
        labelSpan.className = 'md-header__theme-label';
        
        // Function to determine current mode based on data-theme attribute or class
        function getCurrentMode() {
          var dataTheme = themeToggle.getAttribute('data-md-color-scheme');
          var htmlElement = document.documentElement;
          
          if (htmlElement.classList.contains('ts-light') || dataTheme === 'default') {
            return 'Light';
          } else if (htmlElement.classList.contains('ts-dark') || dataTheme === 'slate') {
            return 'Dark';
          } else {
            return 'System';
          }
        }
        
        // Set initial label
        labelSpan.textContent = getCurrentMode();
        
        // Insert the label after the toggle
        themeToggle.parentNode.insertBefore(labelSpan, themeToggle.nextSibling);
        
        // Create an observer to watch for theme changes
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.type === 'attributes' && (mutation.attributeName === 'class' || mutation.attributeName === 'data-md-color-scheme')) {
              labelSpan.textContent = getCurrentMode();
            }
          });
        });
        
        // Observe the HTML element for class changes (theme changes)
        observer.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['class', 'data-md-color-scheme']
        });
        
        // Also observe the toggle for changes
        observer.observe(themeToggle, {
          attributes: true,
          attributeFilter: ['data-md-color-scheme']
        });
        
        // Listen for theme change events from Material theme
        document.addEventListener('md-color-scheme-change', function() {
          labelSpan.textContent = getCurrentMode();
        });
      }
    }, 200);
  });
</script>
{% endblock %}
