{% extends "base.html" %}

{% block styles %}
{{ super() }}
<style>
  /* Subtle sidebar styling with arrows */
  
  /* Left sidebar */
  .md-sidebar--primary {
    border-right: 1px solid var(--md-default-fg-color--lightest);
  }
  
  /* Navigation section arrows */
  .md-sidebar--primary .md-nav__toggle::after {
    content: "▶";
    display: inline-block;
    font-size: 0.6em;
    margin-left: 0.5em;
    transition: transform 0.2s ease;
  }
  
  .md-sidebar--primary .md-nav__toggle[aria-expanded="true"]::after {
    transform: rotate(90deg);
  }
  
  /* Collapsible sections */
  .md-sidebar--primary .md-nav__item--section {
    margin: 0;
  }
  
  /* DISABLE hover highlight effect on navigation items */
  .md-sidebar--primary .md-nav__item:hover {
    background-color: transparent !important;
  }
  
  .md-sidebar--primary .md-nav__item:hover > .md-nav__link {
    background-color: transparent !important;
  }
  
  /* Remove any hover backgrounds on nav links */
  .md-sidebar--primary .md-nav__link:hover {
    background-color: transparent !important;
  }
  
  /* Active link styling */
  .md-sidebar--primary .md-nav__link--active {
    color: var(--md-primary-fg-color);
  }
  
  /* Right sidebar (TOC) */
  .md-sidebar--secondary {
    border-left: 1px solid var(--md-default-fg-color--lightest);
  }
  
  /* TOC arrows */
  .md-sidebar--secondary .md-nav__toggle::after {
    content: "▶";
    display: inline-block;
    font-size: 0.6em;
    margin-left: 0.3em;
    transition: transform 0.2s ease;
  }
  
  .md-sidebar--secondary .md-nav__toggle[aria-expanded="true"]::after {
    transform: rotate(90deg);
  }
</style>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
  /* JavaScript to collapse AWS and Azure sections on page load */
  document.addEventListener('DOMContentLoaded', function() {
    // Wait for Material theme to initialize
    setTimeout(function() {
      // Find all navigation sections in the primary sidebar
      var navSections = document.querySelectorAll('.md-sidebar--primary .md-nav__item--section');
      
      navSections.forEach(function(section) {
        var link = section.querySelector('.md-nav__link');
        var toggle = section.querySelector('.md-nav__toggle');
        
        // Check if this section is for AWS or Azure
        var sectionTitle = link ? link.textContent.trim() : '';
        if (sectionTitle === 'AWS' || sectionTitle === 'Azure') {
          // Force collapse the section
          if (toggle) {
            toggle.checked = false;
            toggle.setAttribute('aria-expanded', 'false');
          }
          
          // Hide the nested nav
          var nestedNav = section.querySelector('.md-nav');
          if (nestedNav) {
            nestedNav.hidden = true;
            nestedNav.setAttribute('aria-labelledby', link.id);
            link.setAttribute('aria-expanded', 'false');
          }
          
          // Add visual indicator that section is collapsed
          section.classList.add('md-nav__item--collapsed');
        }
      });
    }, 100);
  });
</script>
{% endblock %}
